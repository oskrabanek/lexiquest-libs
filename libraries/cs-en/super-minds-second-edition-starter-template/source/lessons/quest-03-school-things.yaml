    type: listen-to-image
    title:
      en: "Listen and Choose"
      cs: "Poslechni a vyber"
    questionCount: 6
    vocabulary:
      - word-book
      - word-pen
      - word-pencil
      - word-bag
      - word-desk
      - word-chair
    direction:
      modes: [cs-to-en, en-to-cs]
      default: cs-to-en
    answerOptions:
      count: 3
      distractorStrategy: same-quest
    rewards:
      completion:
        coins: configured-by-app
        stars: configured-by-app
    validation:
      caseSensitive: false
      ignoreDiacritics: app-setting
      allowTypos: false
