formatVersion: 1
id: quest-03-school-things
title:
  en: "School Things"
  cs: "Školní věci"
order: 3
description:
  en: "Original starter practice set for school things."
  cs: "Originální starter procvičování pro téma: Školní věci."
vocabulary:
  - word-book
  - word-pen
  - word-pencil
  - word-bag
  - word-desk
  - word-chair
  - word-ruler
  - word-rubber
challenges:
